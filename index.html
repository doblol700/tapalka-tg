<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мототапалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-color: #0d1117;
    --text-color: #e2e8f0;
    --text-dim: #93a3b8;
    --accent-orange: #f97316;
    --accent-cyan: #22d3ee;
    --ui-bg: rgba(13, 17, 23, 0.88);
    --card-bg: rgba(22, 30, 41, 0.92);
    --glow: 0 0 10px var(--accent-cyan);
    --glow-orange: 0 0 10px var(--accent-orange);
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app-container {
    height: 100%;
    width: 100%;
    background-image: url('garage1.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP PANEL --- */
  .top-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: var(--ui-bg);
    border-bottom: 2px solid var(--accent-cyan);
    box-shadow: var(--glow);
    flex-shrink: 0;
  }

  .user-info { display: flex; align-items: center; gap: 10px; }

  .avatar-placeholder {
    width: 45px; height: 45px; border-radius: 50%;
    border: 2px solid var(--accent-orange);
    background: #2d3748;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: white;
    box-shadow: var(--glow-orange);
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar-placeholder img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .stats-text { font-size: 13px; line-height: 1.2; }
  .level-bar { width: 90px; height: 5px; background: #4a5568; border-radius: 3px; margin-top: 4px; }
  .level-progress { width: 78%; height: 100%; background-color: var(--accent-orange); border-radius: 3px; }

  .currency-panel { display: flex; gap: 8px; }
  .currency-item {
    background: rgba(45, 55, 72, 0.9);
    padding: 5px 8px; border-radius: 5px;
    font-size: 13px; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--accent-cyan);
    white-space: nowrap;
  }

  /* --- SCREENS --- */
  .screens { flex-grow: 1; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; }

  /* --- GARAGE SCREEN --- */
  .tap-zone {
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 10px 10px;
    min-height: 240px;
  }

  .active-bike-name {
    font-size: 13px;
    color: var(--accent-cyan);
    text-shadow: 0 0 8px rgba(34,211,238,0.6);
    margin-bottom: 4px;
    text-align: center;
  }

  #points-display {
    font-size: 44px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px var(--accent-orange);
    z-index: 3;
    pointer-events: none;
    text-align: center;
    margin-bottom: 6px;
  }

  .per-tap-display {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 14px;
    pointer-events: none;
  }

  .bike-emoji-btn {
    font-size: 92px;
    line-height: 1;
    filter: drop-shadow(0 0 18px rgba(249,115,22,0.55));
    transition: transform 0.08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bike-emoji-btn:active { transform: scale(0.9); }
  .bike-emoji-btn.is-svg { width: 190px; filter: none; }

  .floating-bonus {
    position: absolute;
    font-size: 22px;
    font-weight: bold;
    color: var(--accent-orange);
    z-index: 4;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
    text-shadow: 0 0 5px #000;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-70px); }
  }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent-cyan);
    margin: 10px 14px 6px;
  }

  /* --- TUNING --- */
  .tuning-list { padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .tuning-row {
    background: var(--card-bg);
    border: 1px solid rgba(34,211,238,0.35);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tuning-icon { font-size: 24px; width: 32px; text-align: center; }
  .tuning-info { flex-grow: 1; }
  .tuning-name { font-size: 14px; font-weight: bold; }
  .tuning-level { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tuning-bar { width: 100%; height: 4px; background: #2d3748; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .tuning-bar-fill { height: 100%; background: var(--accent-orange); }

  .upgrade-btn {
    background: var(--accent-orange);
    color: #1a1a1a;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .upgrade-btn:disabled {
    background: #4a5568;
    color: #8a97a8;
    cursor: default;
  }

  /* --- SHOP SCREEN --- */
  .shop-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 12px 4px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .shop-tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid rgba(34,211,238,0.35);
    background: rgba(15,23,42,0.6);
    color: var(--accent-cyan);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .shop-tab.active {
    background: var(--accent-orange);
    color: #1a1a1a;
    border-color: var(--accent-orange);
  }

  .bike-list { padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .bike-card {
    background: var(--card-bg);
    border: 1px solid rgba(34,211,238,0.35);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bike-card-emoji { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .bike-card-emoji svg { width: 100%; height: auto; display: block; }
  .bike-card-info { flex-grow: 1; min-width: 0; }
  .bike-card-name { font-size: 14px; font-weight: bold; }
  .bike-card-stats { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .bike-card-price { font-size: 12px; color: var(--accent-orange); margin-top: 2px; font-weight: bold; }

  .bike-btn {
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .bike-btn.buy { background: var(--accent-orange); color: #1a1a1a; }
  .bike-btn.buy:disabled { background: #4a5568; color: #8a97a8; }
  .bike-btn.select { background: var(--accent-cyan); color: #1a1a1a; }
  .bike-btn.selected { background: #2d3748; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

  /* --- MISSIONS SCREEN --- */
  .missions-list { padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .mission-card {
    background: var(--card-bg);
    border: 1px solid rgba(34,211,238,0.35);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mission-info { flex-grow: 1; }
  .mission-name { font-size: 13px; font-weight: bold; }
  .mission-progress { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .mission-reward { font-size: 12px; color: var(--accent-orange); margin-top: 3px; font-weight: bold; }
  .claim-btn {
    border: none; border-radius: 8px; padding: 8px 10px;
    font-size: 12px; font-weight: bold; cursor: pointer; flex-shrink: 0;
    background: var(--accent-orange); color: #1a1a1a;
  }
  .claim-btn:disabled { background: #4a5568; color: #8a97a8; }
  .claim-btn.done { background: #2d3748; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

  /* --- CLAN SCREEN --- */
  .clan-placeholder {
    margin: auto;
    text-align: center;
    padding: 30px;
    color: var(--text-dim);
  }
  .clan-placeholder .icon { font-size: 48px; margin-bottom: 10px; }
  .clan-placeholder .title { font-size: 16px; color: var(--text-color); font-weight: bold; margin-bottom: 6px; }

  /* --- NAV PANEL --- */
  .nav-panel {
    display: flex;
    justify-content: space-around;
    padding: 10px 5px;
    background: var(--ui-bg);
    border-top: 2px solid var(--accent-cyan);
    box-shadow: var(--glow);
    flex-shrink: 0;
  }
  .nav-item {
    text-align: center;
    cursor: pointer;
    color: var(--accent-cyan);
    opacity: 0.6;
    transition: opacity 0.2s;
    flex: 1;
  }
  .nav-item.active { opacity: 1; }
  .nav-item-icon { font-size: 20px; }
  .nav-text-label { font-size: 10px; font-weight: bold; text-transform: uppercase; margin-top: 3px; }
  .nav-item.active .nav-text-label { color: var(--accent-orange); }

  /* --- КНОПКА СТАРТ (в гараже) --- */
  .start-stunt-wrap { padding: 4px 12px 18px; }
  .start-stunt-btn {
    width: 100%;
    padding: 14px 10px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent-orange), #ea580c);
    color: #1a1a1a;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(249,115,22,0.5);
  }
  .start-stunt-btn:active { transform: scale(0.98); }

  /* --- СТАНТ-ЗАЕЗД: ОВЕРЛЕЙ --- */
  .stunt-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: linear-gradient(180deg, #0b1220 0%, #16202e 55%, #0d1117 100%);
    display: flex;
    flex-direction: column;
  }
  .stunt-overlay.hidden { display: none; }

  .stunt-hud {
    display: flex;
    justify-content: space-around;
    padding: 12px 10px 6px;
    flex-shrink: 0;
  }
  .stunt-hud-item {
    background: rgba(15,23,42,0.7);
    border: 1px solid rgba(34,211,238,0.4);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: var(--glow);
  }

  .stunt-scene {
    flex-grow: 1;
    position: relative;
    overflow: hidden;
  }

  .stunt-bike-wrap {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .stunt-bike {
    font-size: 72px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transform-origin: 75% 85%;
    transition: transform 0.05s linear;
    filter: drop-shadow(0 0 14px rgba(249,115,22,0.6));
  }
  .stunt-bike.is-svg { width: 170px; filter: none; }

  .stunt-road {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: 34%;
    background-color: #1c1f26;
    background-image:
      linear-gradient(180deg, rgba(34,211,238,0.15), transparent 40%),
      repeating-linear-gradient(90deg, #f1f5f9 0 40px, transparent 40px 90px);
    background-position: 0 0, 0 85%;
    background-size: 100% 100%, 130px 6px;
    border-top: 3px solid var(--accent-cyan);
    box-shadow: 0 0 20px rgba(34,211,238,0.35);
  }

  .stunt-controls {
    display: flex;
    height: 26%;
    flex-shrink: 0;
  }
  .stunt-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .stunt-zone-icon { font-size: 34px; }
  .stunt-zone.brake {
    background: rgba(239,68,68,0.15);
    border-top: 2px solid rgba(239,68,68,0.6);
    color: #fca5a5;
  }
  .stunt-zone.brake.pressed { background: rgba(239,68,68,0.4); }
  .stunt-zone.gas {
    background: rgba(249,115,22,0.15);
    border-top: 2px solid var(--accent-orange);
    color: var(--accent-orange);
  }
  .stunt-zone.gas.pressed { background: rgba(249,115,22,0.45); }

  .stunt-close-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(34,211,238,0.5);
    background: rgba(15,23,42,0.75);
    color: var(--text-color);
    font-size: 15px;
    cursor: pointer;
    z-index: 5;
  }

  .stunt-result {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
  }
  .stunt-result.hidden { display: none; }
  .stunt-result-card {
    background: var(--card-bg);
    border: 1px solid rgba(34,211,238,0.5);
    border-radius: 14px;
    padding: 22px 24px;
    text-align: center;
    width: 78%;
    max-width: 320px;
    box-shadow: var(--glow);
  }
  .stunt-result-title { font-size: 18px; font-weight: bold; color: var(--accent-orange); margin-bottom: 10px; }
  .stunt-result-stats { font-size: 14px; line-height: 1.8; color: var(--text-color); margin-bottom: 16px; }
  .stunt-result-stats b { color: var(--accent-cyan); }

  /* --- ИСКРЫ (задним крылом об асфальт) --- */
  .stunt-spark-anchor {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 0;
    height: 0;
    transform: translate(42px, 34px);
    pointer-events: none;
  }
  .spark-particle {
    position: absolute;
    width: 7px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, #fff9c4, #f97316);
    box-shadow: 0 0 6px 1px rgba(249,115,22,0.9);
    pointer-events: none;
    z-index: 4;
    animation: sparkFly 0.5s ease-out forwards;
  }
  @keyframes sparkFly {
    0%   { opacity: 1; transform: translate(0,0) rotate(var(--sa, 0deg)) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx, 20px), var(--sy, -10px)) rotate(var(--sa, 0deg)) scale(0.3); }
  }
</style>
</head>
<body>

<div id="app-container">

  <!-- Верхняя панель -->
  <div class="top-panel">
    <div class="user-info">
      <div class="avatar-placeholder" id="avatar-placeholder">VIP</div>
      <div class="stats-text">
        <strong id="user-nickname">RIDERNICK</strong><br>
        Lv 15
        <div class="level-bar"><div class="level-progress"></div></div>
      </div>
    </div>
    <div class="currency-panel">
      <div class="currency-item" id="coins-display">🪙 0</div>
    </div>
  </div>

  <div class="screens">

    <!-- ГАРАЖ -->
    <div class="screen active" id="screen-garage">
      <div id="tap-zone" class="tap-zone">
        <div class="active-bike-name" id="active-bike-name">Honda Dio 27</div>
        <div id="points-display">0 pts</div>
        <div class="per-tap-display" id="per-tap-display">+1 за тап</div>
        <div class="bike-emoji-btn" id="bike-emoji">🏍️</div>
      </div>
      <div class="section-title">Тюнинг</div>
      <div class="tuning-list" id="tuning-list"></div>
      <div class="start-stunt-wrap">
        <button id="start-stunt-btn" class="start-stunt-btn">🏁 СТАРТ — СТАНТ ЗАЕЗД</button>
      </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="screen" id="screen-shop">
      <div class="shop-tabs" id="shop-tabs"></div>
      <div class="bike-list" id="bike-list"></div>
    </div>

    <!-- МИССИИ -->
    <div class="screen" id="screen-missions">
      <div class="section-title">Задания</div>
      <div class="missions-list" id="missions-list"></div>
    </div>

    <!-- КЛАН -->
    <div class="screen" id="screen-clan">
      <div class="clan-placeholder">
        <div class="icon">👥</div>
        <div class="title">Кланы в разработке</div>
        <div>Скоро здесь можно будет объединяться с другими райдерами и соревноваться командами.</div>
      </div>
    </div>

  </div>

  <!-- Нижняя панель -->
  <div class="nav-panel">
    <div class="nav-item active" data-screen="garage">
      <div class="nav-item-icon">🔧</div>
      <div class="nav-text-label">Гараж</div>
    </div>
    <div class="nav-item" data-screen="shop">
      <div class="nav-item-icon">🛒</div>
      <div class="nav-text-label">Магазин</div>
    </div>
    <div class="nav-item" data-screen="missions">
      <div class="nav-item-icon">🎯</div>
      <div class="nav-text-label">Задания</div>
    </div>
    <div class="nav-item" data-screen="clan">
      <div class="nav-item-icon">👥</div>
      <div class="nav-text-label">Клан</div>
    </div>
  </div>

</div>

<!-- СТАНТ-ЗАЕЗД (оверлей) -->
<div id="stunt-overlay" class="stunt-overlay hidden">
  <div class="stunt-hud">
    <div class="stunt-hud-item">⏱ <span id="stunt-timer">0.0</span>с</div>
    <div class="stunt-hud-item">📐 <span id="stunt-angle">0</span>°</div>
    <div class="stunt-hud-item">🪙 <span id="stunt-coins-preview">0</span></div>
  </div>

  <div class="stunt-scene">
    <div class="stunt-bike-wrap">
      <div class="stunt-bike" id="stunt-bike">🏍️</div>
    </div>
    <div class="stunt-spark-anchor" id="stunt-spark-anchor"></div>
    <div class="stunt-road" id="stunt-road"></div>
  </div>

  <div class="stunt-controls">
    <div class="stunt-zone brake" id="stunt-brake">
      <div class="stunt-zone-icon">🛑</div>
      <div class="stunt-zone-label">ТОРМОЗ</div>
    </div>
    <div class="stunt-zone gas" id="stunt-gas">
      <div class="stunt-zone-icon">⚡</div>
      <div class="stunt-zone-label">ГАЗ</div>
    </div>
  </div>

  <div class="stunt-result hidden" id="stunt-result">
    <div class="stunt-result-card">
      <div class="stunt-result-title" id="stunt-result-title">Заезд окончен!</div>
      <div class="stunt-result-stats" id="stunt-result-stats"></div>
      <button id="stunt-claim-btn" class="claim-btn">Забрать награду</button>
    </div>
  </div>

  <button id="stunt-close-btn" class="stunt-close-btn">✕</button>
</div>

<script>
/* =========================================================
   SVG-ИКОНКА РЕАЛЬНОГО СКУТЕРА (по мотивам Honda Dio, чёрный)
   Используется для гаража, карточек магазина и стант-заезда
   ========================================================= */
function scooterSvgMarkup(cls) {
  return `<svg class="${cls}" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="150" cy="146" rx="140" ry="8" fill="rgba(0,0,0,0.35)"/>
  <circle cx="62" cy="122" r="36" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="5"/>
  <circle cx="62" cy="122" r="15" fill="#4b5563"/>
  <circle cx="62" cy="122" r="5" fill="#1a1a1a"/>
  <circle cx="232" cy="122" r="36" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="5"/>
  <circle cx="232" cy="122" r="20" fill="none" stroke="#7d8896" stroke-width="3"/>
  <circle cx="232" cy="122" r="15" fill="#4b5563"/>

/* =========================================================
   СОСТОЯНИЕ ИГРЫ (сохраняется в localStorage)
   ========================================================= */
const SAVE_KEY = 'motoTapalkaSave';

function defaultState() {
  return {
    coins: 500,
    totalTaps: 0,
    ownedBikeIds: [],
    activeBikeId: 'starter',
    tuning: { engine: 0, exhaust: 0, suspension: 0, tires: 0 },
    claimedMissions: {}
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) {
    return defaultState();
  }
}

let state = loadState();

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* =========================================================
   ПОМОЩНИКИ
   ========================================================= */
function findBikeById(id) {
  if (id === 'starter') return STARTER_BIKE;
  for (const cat of Object.values(BIKE_CATALOG)) {
    const found = cat.bikes.find(b => b.id === id);
    if (found) return found;
  }
  return STARTER_BIKE;
}

function activeBike() {
  return findBikeById(state.activeBikeId);
}

function tuningCost(type, level) {
  return Math.round(type.baseCost * Math.pow(type.costMult, level));
}

function perTapValue() {
  const bike = activeBike();
  let value = bike.power || 1;
  TUNING_TYPES.forEach(t => {
    value += (state.tuning[t.id] || 0) * t.powerPerLevel;
  });
  return value;
}

function fmt(n) {
  return Math.round(n).toLocaleString('ru-RU');
}

/* =========================================================
   РЕНДЕР: верхняя панель
   ========================================================= */
function renderTop() {
  document.getElementById('coins-display').innerText = '🪙 ' + fmt(state.coins);
}

/* =========================================================
   РЕНДЕР: гараж (тап-зона + тюнинг)
   ========================================================= */
function renderGarage() {
  const bike = activeBike();
  document.getElementById('active-bike-name').innerText = bike.name;
  document.getElementById('points-display').innerText = fmt(state.coins) + ' pts';
  document.getElementById('per-tap-display').innerText = '+' + perTapValue() + ' за тап';

  const iconEl = document.getElementById('bike-emoji');
  if (bike.svgType === 'scooter') {
    iconEl.classList.add('is-svg');
    iconEl.innerHTML = scooterSvgMarkup('scooter-icon-garage');
  } else {
    iconEl.classList.remove('is-svg');
    iconEl.innerText = bike.emoji || '🏍️';
  }

  const list = document.getElementById('tuning-list');
  list.innerHTML = '';
  TUNING_TYPES.forEach(t => {
    const level = state.tuning[t.id] || 0;
    const maxed = level >= t.maxLevel;
    const cost = tuningCost(t, level);
    const canAfford = state.coins >= cost;

    const row = document.createElement('div');
    row.className = 'tuning-row';
    row.innerHTML = `
      <div class="tuning-icon">${t.icon}</div>
      <div class="tuning-info">
        <div class="tuning-name">${t.name}</div>
        <div class="tuning-level">Уровень ${level} / ${t.maxLevel}</div>
        <div class="tuning-bar"><div class="tuning-bar-fill" style="width:${(level / t.maxLevel) * 100}%"></div></div>
      </div>
      <button class="upgrade-btn" ${maxed || !canAfford ? 'disabled' : ''} data-tune="${t.id}">
        ${maxed ? 'Макс.' : '🪙 ' + fmt(cost)}
      </button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('button[data-tune]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-tune');
      const type = TUNING_TYPES.find(t => t.id === id);
      const level = state.tuning[id] || 0;
      if (level >= type.maxLevel) return;
      const cost = tuningCost(type, level);
      if (state.coins < cost) return;
      state.coins -= cost;
      state.tuning[id] = level + 1;
      saveState();
      renderTop();
      renderGarage();
      renderMissions();
    });
  });
}

let activeShopTab = 'scooter';

function renderBikeList() {
  const listEl = document.getElementById('bike-list');
  listEl.innerHTML = '';
  const cat = BIKE_CATALOG[activeShopTab];

  cat.bikes.forEach(bike => {
    const owned = bike.id === 'starter' || state.ownedBikeIds.includes(bike.id);
    const selected = state.activeBikeId === bike.id;
    const canAfford = state.coins >= bike.price;

    const card = document.createElement('div');
    card.className = 'bike-card';

    let btnHtml;
    if (selected) {
      btnHtml = `<button class="bike-btn selected" disabled>Выбран</button>`;
    } else if (owned) {
      btnHtml = `<button class="bike-btn select" data-select="${bike.id}">Выбрать</button>`;
    } else {
      btnHtml = `<button class="bike-btn buy" data-buy="${bike.id}" ${canAfford ? '' : 'disabled'}>🪙 ${fmt(bike.price)}</button>`;
    }

    const iconInner = bike.svgType === 'scooter' ? scooterSvgMarkup('scooter-icon-card') : cat.emoji;

    card.innerHTML = `
      <div class="bike-card-emoji">${iconInner}</div>
      <div class="bike-card-info">
        <div class="bike-card-name">${bike.name}</div>
        <div class="bike-card-stats">Сила клика: ${bike.power} · Макс. скорость: ${bike.top}</div>
        <div class="bike-card-price">${owned ? 'Куплен' : '🪙 ' + fmt(bike.price)}</div>
      </div>
      ${btnHtml}
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('button[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-buy');
      const bike = findBikeById(id);
      if (state.coins < bike.price) return;
      state.coins -= bike.price;
      state.ownedBikeIds.push(id);
      state.activeBikeId = id;
      saveState();
      renderTop();
      renderBikeList();
      renderGarage();
      renderMissions();
    });
  });

  listEl.querySelectorAll('button[data-select]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-select');
      state.activeBikeId = id;
      saveState();
      renderBikeList();
      renderGarage();
    });
  });
}

/* =========================================================
   РЕНДЕР: миссии
   ========================================================= */
function missionProgressValue(mission) {
  if (mission.type === 'taps') return state.totalTaps;
  if (mission.type === 'coins') return state.coins;
  if (mission.type === 'ownedBikes') return state.ownedBikeIds.length;
  if (mission.type === 'tuneLevel') return Math.max(0, ...Object.values(state.tuning));
  return 0;
}

function renderMissions() {
  const listEl = document.getElementById('missions-list');
  listEl.innerHTML = '';

  MISSIONS.forEach(m => {
    const progress = missionProgressValue(m);
    const complete = progress >= m.target;
    const claimed = !!state.claimedMissions[m.id];

    const card = document.createElement('div');
    card.className = 'mission-card';

    let btnHtml;
    if (claimed) {
      btnHtml = `<button class="claim-btn done" disabled>Получено</button>`;
    } else if (complete) {
      btnHtml = `<button class="claim-btn" data-claim="${m.id}">Забрать</button>`;
    } else {
      btnHtml = `<button class="claim-btn" disabled>${Math.min(progress, m.target)}/${m.target}</button>`;
    }

    card.innerHTML = `
      <div class="mission-info">
        <div class="mission-name">${m.name}</div>
        <div class="mission-progress">Прогресс: ${Math.min(progress, m.target)} / ${m.target}</div>
        <div class="mission-reward">Награда: 🪙 ${fmt(m.reward)}</div>
      </div>
      ${btnHtml}
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('button[data-claim]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-claim');
      const mission = MISSIONS.find(m => m.id === id);
      if (state.claimedMissions[id]) return;
      if (missionProgressValue(mission) < mission.target) return;
      state.coins += mission.reward;
      state.claimedMissions[id] = true;
      saveState();
      renderTop();
      renderMissions();
      renderGarage();
    });
  });
}

const tapZone = document.getElementById('tap-zone');
tapZone.addEventListener('click', (e) => {

  document.getElementById('points-display').innerText = fmt(state.coins) + ' pts';

  b.style.left = (x - 15) + 'px';
  b.style.top = (y - 30) + 'px';
  tapZone.appendChild(b);
  setTimeout(() => b.remove(), 800);

  // Миссии могут обновиться в фоне — перерисуем при следующем открытии экрана

const stuntOverlay   = document.getElementById('stunt-overlay');
const stuntBikeEl    = document.getElementById('stunt-bike');
const stuntRoadEl    = document.getElementById('stunt-road');
const stuntTimerEl   = document.getElementById('stunt-timer');
const stuntAngleEl   = document.getElementById('stunt-angle');
const stuntCoinsEl   = document.getElementById('stunt-coins-preview');
const stuntResultEl  = document.getElementById('stunt-result');
const stuntResultStatsEl = document.getElementById('stunt-result-stats');
const gasZone   = document.getElementById('stunt-gas');
const brakeZone = document.getElementById('stunt-brake');
const stuntSceneEl  = document.querySelector('.stunt-scene');
const sparkAnchorEl = document.getElementById('stunt-spark-anchor');

const STUNT_MAX_ANGLE = 92;   // угол — заваливаемся назад (крашимся, крыло чиркает по асфальту)
const STUNT_MIN_ANGLE = -18;  // угол — зарываемся передним колесом (крашимся)
const SPARK_ANGLE_THRESHOLD = 88; // с этого угла заднее крыло уже касается асфальта — летят искры
const SPARK_INTERVAL_MS = 45;

let stunt = null; // объект состояния текущего заезда
let lastSparkTs = 0;

function stuntCoinsForState(elapsedSec, maxAngle) {
  return Math.floor(elapsedSec * 18 + maxAngle * 5);
}

/* --- искры --- */
function clearSparks() {
  stuntSceneEl.querySelectorAll('.spark-particle').forEach(el => el.remove());
}

function spawnSparkBurst(count) {
  const anchorRect = sparkAnchorEl.getBoundingClientRect();
  const sceneRect = stuntSceneEl.getBoundingClientRect();
  const baseX = anchorRect.left - sceneRect.left;
  const baseY = anchorRect.top - sceneRect.top;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'spark-particle';
    const angleDeg = -100 + (Math.random() * 80 - 40); // разлёт назад-вверх/вниз от точки касания
    const dist = 16 + Math.random() * 26;
    const rad = angleDeg * Math.PI / 180;
    const sx = Math.cos(rad) * dist;
    const sy = Math.sin(rad) * dist;
    el.style.left = baseX + 'px';
    el.style.top = baseY + 'px';
    el.style.setProperty('--sx', sx.toFixed(1) + 'px');
    el.style.setProperty('--sy', sy.toFixed(1) + 'px');
    el.style.setProperty('--sa', (Math.random() * 360).toFixed(0) + 'deg');
    stuntSceneEl.appendChild(el);
    setTimeout(() => el.remove(), 550);
  }
}

function maybeSpawnSparks(ts) {
  if (!stunt || stunt.crashed) return;
  if (stunt.angle >= SPARK_ANGLE_THRESHOLD) {
    if (ts - lastSparkTs > SPARK_INTERVAL_MS) {
      spawnSparkBurst(2 + Math.floor(Math.random() * 2));
      lastSparkTs = ts;
    }
  }
}

function openStunt() {
  stunt = {
    angle: 0,
    speed: 30,
    roadOffset: 0,
    elapsed: 0,
    maxAngle: 0,
    gas: false,
    brake: false,
    crashed: false,
    lastTs: null,
    rafId: null,
  };
  lastSparkTs = 0;
  clearSparks();
  stuntResultEl.classList.add('hidden');
  stuntOverlay.classList.remove('hidden');

  const bike = activeBike();
  if (bike.svgType === 'scooter') {
    stuntBikeEl.classList.add('is-svg');
    stuntBikeEl.innerHTML = scooterSvgMarkup('scooter-icon-stunt');
  } else {
    stuntBikeEl.classList.remove('is-svg');
    stuntBikeEl.innerText = bike.emoji || '🏍️';
  }

  stuntBikeEl.style.transform = 'rotate(0deg)';
  stuntTimerEl.innerText = '0.0';
  stuntAngleEl.innerText = '0';
  stuntCoinsEl.innerText = '0';
  stunt.rafId = requestAnimationFrame(stuntTick);
}

function closeStunt() {
  if (stunt && stunt.rafId) cancelAnimationFrame(stunt.rafId);
  stunt = null;
  clearSparks();
  stuntOverlay.classList.add('hidden');
}

function stuntTick(ts) {
  if (!stunt || stunt.crashed) return;
  if (stunt.lastTs === null) stunt.lastTs = ts;
  const dt = Math.min((ts - stunt.lastTs) / 1000, 0.05);
  stunt.lastTs = ts;

  // --- физика ---
  if (stunt.gas) {
    stunt.angle += 55 * dt;
    stunt.speed = Math.min(stunt.speed + 35 * dt, 100);
  } else {
    stunt.speed = Math.max(stunt.speed - 12 * dt, 22);
  }
  if (stunt.brake) {
    stunt.angle -= 85 * dt;
    stunt.speed = Math.max(stunt.speed - 70 * dt, 0);
  }
  // лёгкий естественный снос угла к нулю, если совсем нет газа
  if (!stunt.gas && !stunt.brake) {
    stunt.angle += (stunt.angle > 0 ? -1 : 1) * 8 * dt;
  }

  stunt.elapsed += dt;
  stunt.maxAngle = Math.max(stunt.maxAngle, stunt.angle);
  stunt.roadOffset -= stunt.speed * dt * 4;

  // --- визуал ---
  stuntBikeEl.style.transform = 'rotate(' + (-stunt.angle) + 'deg)';
  stuntRoadEl.style.backgroundPosition = '0 0, ' + stunt.roadOffset + 'px 85%';
  stuntTimerEl.innerText = stunt.elapsed.toFixed(1);
  stuntAngleEl.innerText = Math.round(Math.max(0, stunt.angle));
  stuntCoinsEl.innerText = fmt(stuntCoinsForState(stunt.elapsed, stunt.maxAngle));

  // --- искры от заднего крыла на большом угле ---
  maybeSpawnSparks(ts);

  // --- проверка краша ---
  if (stunt.angle >= STUNT_MAX_ANGLE || stunt.angle <= STUNT_MIN_ANGLE) {
    stunt.crashed = true;
    if (stunt.angle >= STUNT_MAX_ANGLE) {
      spawnSparkBurst(16); // крупный сноп искр в момент удара крыла об асфальт
    }
    finishStunt();
    return;
  }

  stunt.rafId = requestAnimationFrame(stuntTick);
}

function finishStunt() {
  const reward = stuntCoinsForState(stunt.elapsed, stunt.maxAngle);
  stuntResultStatsEl.innerHTML =
    'Время в станте: <b>' + stunt.elapsed.toFixed(1) + 'с</b><br>' +
    'Макс. угол: <b>' + Math.round(stunt.maxAngle) + '°</b><br>' +
    'Награда: <b>🪙 ' + fmt(reward) + '</b>';
  stuntResultEl.dataset.reward = reward;
  stuntResultEl.classList.remove('hidden');
}

function claimStuntReward() {
  const reward = parseInt(stuntResultEl.dataset.reward || '0', 10);
  state.coins += reward;
  saveState();
  renderTop();
  renderGarage();
  renderMissions();
  closeStunt();
}

document.getElementById('start-stunt-btn').addEventListener('click', openStunt);
document.getElementById('stunt-close-btn').addEventListener('click', closeStunt);
document.getElementById('stunt-claim-btn').addEventListener('click', claimStuntReward);

function bindHold(el, onPress, onRelease) {
  const press = (e) => { e.preventDefault(); onPress(); };
  const release = (e) => { e.preventDefault(); onRelease(); };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointerleave', release);
  el.addEventListener('pointercancel', release);
}

bindHold(gasZone,
  () => { if (stunt && !stunt.crashed) { stunt.gas = true; gasZone.classList.add('pressed'); } },
  () => { if (stunt) { stunt.gas = false; } gasZone.classList.remove('pressed'); }
);
bindHold(brakeZone,
  () => { if (stunt && !stunt.crashed) { stunt.brake = true; brakeZone.classList.add('pressed'); } },
  () => { if (stunt) { stunt.brake = false; } brakeZone.classList.remove('pressed'); }
);

/* =========================================================
   СТАРТ
   ========================================================= */
initTelegramUser();
renderTop();
renderGarage();
renderShopTabs();
renderBikeList();
renderMissions();
</script>
