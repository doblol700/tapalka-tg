<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мототапалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-color: #0d1117;
    --text-color: #e2e8f0;
    --text-dim: #93a3b8;
    --accent-orange: #f97316;
    --accent-cyan: #22d3ee;
    --ui-bg: rgba(13, 17, 23, 0.88);
    --card-bg: rgba(22, 30, 41, 0.92);
    --glow: 0 0 10px var(--accent-cyan);
    --glow-orange: 0 0 10px var(--accent-orange);
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app-container {
    height: 100%;
    width: 100%;
    background-image: url('garage1.jpg');
    background-size: cover;
    background-position: center;
    background-color: #0b1220;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP PANEL --- */
  .top-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 15px 10px 15px; 
    background: var(--ui-bg);
    border-bottom: 2px solid var(--accent-cyan);
    box-shadow: var(--glow);
    flex-shrink: 0;
  }

  .user-info { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    cursor: pointer;
    transition: transform 0.1s;
    padding: 4px;
    border-radius: 8px;
  }
  .user-info:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

  .avatar-placeholder {
    width: 45px; height: 45px; border-radius: 50%;
    border: 2px solid var(--accent-orange);
    background: #2d3748;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: white;
    box-shadow: var(--glow-orange);
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar-placeholder img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .stats-text { font-size: 13px; line-height: 1.2; }
  .level-bar { width: 90px; height: 5px; background: #4a5568; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .level-progress { width: 0%; height: 100%; background-color: var(--accent-orange); border-radius: 3px; transition: width 0.3s ease; }

  .currency-panel { display: flex; gap: 8px; }
  .currency-item {
    background: rgba(45, 55, 72, 0.9);
    padding: 5px 8px; border-radius: 5px;
    font-size: 13px; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--accent-cyan);
    white-space: nowrap;
  }

  /* --- SCREENS --- */
  .screens { flex-grow: 1; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; }

  /* --- GARAGE SCREEN --- */
  .tap-zone { flex-shrink: 0; position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 10px 10px; min-height: 240px; }
  .active-bike-name { font-size: 13px; color: var(--accent-cyan); text-shadow: 0 0 8px rgba(34,211,238,0.6); margin-bottom: 4px; text-align: center; }
  #points-display { font-size: 44px; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px var(--accent-orange); z-index: 3; pointer-events: none; text-align: center; margin-bottom: 6px; }
  .per-tap-display { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; pointer-events: none; }
  .bike-emoji-btn { font-size: 92px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .bike-emoji-btn.is-svg { width: 190px; }
  .floating-bonus { position: absolute; font-size: 22px; font-weight: bold; color: var(--accent-orange); z-index: 4; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 5px #000; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-70px); } }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-cyan); margin: 10px 14px 6px; }

  /* --- TUNING --- */
  .tuning-list { padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .tuning-row { background: var(--card-bg); border: 1px solid rgba(34,211,238,0.35); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .tuning-icon { font-size: 24px; width: 32px; text-align: center; }
  .tuning-info { flex-grow: 1; }
  .tuning-name { font-size: 14px; font-weight: bold; }
  .tuning-level { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tuning-bar { width: 100%; height: 4px; background: #2d3748; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .tuning-bar-fill { height: 100%; background: var(--accent-orange); }
  .upgrade-btn { background: var(--accent-orange); color: #1a1a1a; border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .upgrade-btn:disabled { background: #4a5568; color: #8a97a8; cursor: default; }

  /* --- SHOP SCREEN --- */
  .shop-tabs { display: flex; gap: 6px; padding: 10px 12px 4px; flex-shrink: 0; overflow-x: auto; }
  .shop-tab { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; border: 1px solid rgba(34,211,238,0.35); background: rgba(15,23,42,0.6); color: var(--accent-cyan); font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
  .shop-tab.active { background: var(--accent-orange); color: #1a1a1a; border-color: var(--accent-orange); }
  .bike-list { padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .bike-card { background: var(--card-bg); border: 1px solid rgba(34,211,238,0.35); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .bike-card-emoji { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .bike-card-emoji img { width: 100%; height: auto; display: block; }
  .bike-card-info { flex-grow: 1; min-width: 0; }
  .bike-card-name { font-size: 14px; font-weight: bold; }
  .bike-card-stats { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .bike-card-price { font-size: 12px; color: var(--accent-orange); margin-top: 2px; font-weight: bold; }
  .bike-btn { border: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: bold; cursor: pointer; flex-shrink: 0; white-space: nowrap; }
  .bike-btn.buy { background: var(--accent-orange); color: #1a1a1a; }
  .bike-btn.buy:disabled { background: #4a5568; color: #8a97a8; }
  .bike-btn.select { background: var(--accent-cyan); color: #1a1a1a; }
  .bike-btn.selected { background: #2d3748; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

  /* --- MISSIONS SCREEN --- */
  .missions-list { padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .mission-card { background: var(--card-bg); border: 1px solid rgba(34,211,238,0.35); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .mission-info { flex-grow: 1; }
  .mission-name { font-size: 13px; font-weight: bold; }
  .mission-progress { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .mission-reward { font-size: 12px; color: var(--accent-orange); margin-top: 3px; font-weight: bold; }
  .claim-btn { border: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: bold; cursor: pointer; flex-shrink: 0; background: var(--accent-orange); color: #1a1a1a; }
  .claim-btn:disabled { background: #4a5568; color: #8a97a8; }
  .claim-btn.done { background: #2d3748; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

  /* --- CLAN SCREEN --- */
  .clan-placeholder { margin: auto; text-align: center; padding: 30px; color: var(--text-dim); }
  .clan-placeholder .icon { font-size: 48px; margin-bottom: 10px; }
  .clan-placeholder .title { font-size: 16px; color: var(--text-color); font-weight: bold; margin-bottom: 6px; }

  /* --- NAV PANEL --- */
  .nav-panel { display: flex; justify-content: space-around; padding: 10px 5px; background: var(--ui-bg); border-top: 2px solid var(--accent-cyan); box-shadow: var(--glow); flex-shrink: 0; }
  .nav-item { text-align: center; cursor: pointer; color: var(--accent-cyan); opacity: 0.6; transition: opacity 0.2s; flex: 1; }
  .nav-item.active { opacity: 1; }
  .nav-item-icon { font-size: 20px; }
  .nav-text-label { font-size: 10px; font-weight: bold; text-transform: uppercase; margin-top: 3px; }
  .nav-item.active .nav-text-label { color: var(--accent-orange); }

  /* --- СТАРТ СТАНТА --- */
  .start-stunt-wrap { padding: 4px 12px 18px; }
  .start-stunt-btn { width: 100%; padding: 14px 10px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent-orange), #ea580c); color: #1a1a1a; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 0 16px rgba(249,115,22,0.5); }
  .start-stunt-btn:active { transform: scale(0.98); }

  /* --- СТАНТ-ЗАЕЗД: ОВЕРЛЕЙ И ДЕНЬ/НОЧЬ --- */
  .stunt-overlay { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; flex-direction: column; }
  .stunt-overlay.hidden { display: none; }
  
  .stunt-hud { display: flex; justify-content: space-around; flex-wrap: wrap; padding: 30px 4px 6px; flex-shrink: 0; z-index: 5; gap: 4px; }
  .stunt-hud-item { background: rgba(15,23,42,0.85); border: 1px solid rgba(34,211,238,0.4); border-radius: 8px; padding: 6px 4px; font-size: 12px; font-weight: bold; box-shadow: var(--glow); text-align: center; flex: 1; min-width: 18%; }
  
  /* Анимация цвета неба (День/Ночь) */
  .stunt-scene { 
    flex-grow: 1; 
    position: relative; 
    overflow: hidden; 
    background-color: var(--sky-color, #4ca1af); 
    transition: background-color 2s ease; 
  }
  
  /* Силуэты города */
  .stunt-city-bg { 
    position: absolute; 
    bottom: 34%; left: 0; right: 0; height: 45%; 
    background-image: 
      linear-gradient(180deg, rgba(15,23,42,0.8) 0%, transparent 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.04) 50px, transparent 50px, transparent 100px); 
    background-size: 100% 100%, 120px 100%; 
    background-position: bottom; 
    z-index: 1; 
    filter: brightness(var(--city-bright, 1));
    transition: filter 2s ease;
  }
  
  .stunt-bike-wrap { position: absolute; bottom: 34%; left: 50%; transform: translate(-50%, 0); z-index: 3; display: flex; justify-content: center; align-items: flex-end; width: 190px; height: 170px; }
  .stunt-bike { width: 100%; transform-origin: 20% 85%; transition: transform 0.05s linear; }
  .stunt-bike img { width: 100%; height: auto; display: block; filter: drop-shadow(0 12px 14px rgba(0,0,0,0.7)); }
  
  .stunt-road { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background-color: #0f1218; background-image: linear-gradient(180deg, #1e293b 0%, #090d16 100%), repeating-linear-gradient(90deg, rgba(255,255,255,0.85) 0, rgba(255,255,255,0.85) 70px, transparent 70px, transparent 140px); background-position: 0 0, 0 18px; background-size: 100% 100%, 140px 8px; border-top: 4px solid var(--accent-cyan); box-shadow: inset 0 25px 25px -20px rgba(0,0,0,0.9); z-index: 2; }
  
  .stunt-controls { display: flex; height: 26%; flex-shrink: 0; z-index: 5; background: #000; }
  .stunt-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: bold; letter-spacing: 1px; font-size: 13px; cursor: pointer; user-select: none; }
  .stunt-zone-icon { font-size: 34px; }
  .stunt-zone.brake { background: rgba(239,68,68,0.15); border-top: 2px solid rgba(239,68,68,0.6); color: #fca5a5; }
  .stunt-zone.brake.pressed { background: rgba(239,68,68,0.4); }
  .stunt-zone.gas { background: rgba(249,115,22,0.15); border-top: 2px solid var(--accent-orange); color: var(--accent-orange); }
  .stunt-zone.gas.pressed { background: rgba(249,115,22,0.45); }
  
  .stunt-close-btn { position: absolute; top: 28px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.5); background: rgba(15,23,42,0.75); color: var(--text-color); font-size: 15px; cursor: pointer; z-index: 10; }
  
  .stunt-result { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.75); }
  .stunt-result.hidden { display: none; }
  .stunt-result-card { background: var(--card-bg); border: 1px solid rgba(34,211,238,0.5); border-radius: 14px; padding: 22px 24px; text-align: center; width: 78%; max-width: 320px; box-shadow: var(--glow); }
  .stunt-result-title { font-size: 18px; font-weight: bold; color: var(--accent-orange); margin-bottom: 10px; }
  .stunt-result-stats { font-size: 14px; line-height: 1.8; color: var(--text-color); margin-bottom: 16px; }
  .stunt-result-stats b { color: var(--accent-cyan); }
  
  /* --- ИСКРЫ ОТ ЗАДНЕГО КРЫЛА --- */
  .stunt-spark-anchor { position: absolute; bottom: 45px; left: 45px; width: 1px; height: 1px; pointer-events: none; z-index: 4; }
  .spark-particle { position: absolute; width: 7px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #fff9c4, #f97316); box-shadow: 0 0 6px 1px rgba(249,115,22,0.9); pointer-events: none; z-index: 4; animation: sparkFly 0.5s ease-out forwards; }
  @keyframes sparkFly { 0% { opacity: 1; transform: translate(0,0) rotate(var(--sa, 0deg)) scale(1); } 100% { opacity: 0; transform: translate(var(--sx, 20px), var(--sy, -10px)) rotate(var(--sa, 0deg)) scale(0.3); } }

  /* --- МОДАЛЬНЫЕ ОКНА --- */
  .custom-modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
  .custom-modal.hidden { display: none; }
  .modal-card { background: var(--card-bg); border: 2px solid var(--accent-orange); border-radius: 16px; padding: 24px; text-align: center; width: 82%; max-width: 320px; box-shadow: 0 0 25px rgba(249,115,22,0.6); position: relative; }
  .modal-title { font-size: 20px; font-weight: bold; color: var(--accent-orange); margin-bottom: 8px; text-shadow: 0 0 10px rgba(249,115,22,0.5); }
  .modal-desc { font-size: 14px; color: var(--text-color); margin-bottom: 18px; line-height: 1.5; }
  .profile-modal-close { position: absolute; top: -12px; right: -12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.5); background: rgba(15,23,42,1); color: var(--text-color); font-size: 15px; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div id="app-container">

  <!-- Верхняя панель с кликабельным профилем -->
  <div class="top-panel">
    <div class="user-info" id="user-profile-btn">
      <div class="avatar-placeholder" id="avatar-placeholder">VIP</div>
      <div class="stats-text">
        <strong id="user-nickname">RIDERNICK</strong><br>
        <span id="user-level-label">Lv 1</span>
        <div class="level-bar"><div class="level-progress" id="level-progress-bar"></div></div>
      </div>
    </div>
    <div class="currency-panel">
      <div class="currency-item" id="coins-display">🪙 0</div>
    </div>
  </div>

  <div class="screens">
    <!-- ГАРАЖ -->
    <div class="screen active" id="screen-garage">
      <div id="tap-zone" class="tap-zone">
        <div class="active-bike-name" id="active-bike-name">Honda Dio 27</div>
        <div id="points-display">0 pts</div>
        <div class="per-tap-display" id="per-tap-display">+1 за тап</div>
        <div class="bike-emoji-btn" id="bike-emoji">🏍️</div>
      </div>
      <div class="section-title">Тюнинг</div>
      <div class="tuning-list" id="tuning-list"></div>
      <div class="start-stunt-wrap">
        <button id="start-stunt-btn" class="start-stunt-btn">🏁 СТАРТ — СТАНТ ЗАЕЗД</button>
      </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="screen" id="screen-shop">
      <div class="shop-tabs" id="shop-tabs"></div>
      <div class="bike-list" id="bike-list"></div>
    </div>

    <!-- МИССИИ -->
    <div class="screen" id="screen-missions">
      <div class="section-title">Задания</div>
      <div class="missions-list" id="missions-list"></div>
    </div>

    <!-- КЛАН -->
    <div class="screen" id="screen-clan">
      <div class="clan-placeholder">
        <div class="icon">👥</div>
        <div class="title">Кланы в разработке</div>
      </div>
    </div>
  </div>

  <!-- Нижняя панель -->
  <div class="nav-panel">
    <div class="nav-item active" data-screen="garage"><div class="nav-item-icon">🔧</div><div class="nav-text-label">Гараж</div></div>
    <div class="nav-item" data-screen="shop"><div class="nav-item-icon">🛒</div><div class="nav-text-label">Магазин</div></div>
    <div class="nav-item" data-screen="missions"><div class="nav-item-icon">🎯</div><div class="nav-text-label">Задания</div></div>
    <div class="nav-item" data-screen="clan"><div class="nav-item-icon">👥</div><div class="nav-text-label">Клан</div></div>
  </div>
</div>

<!-- СТАНТ-ЗАЕЗД (оверлей) -->
<div id="stunt-overlay" class="stunt-overlay hidden">
  <div class="stunt-hud">
    <div class="stunt-hud-item">⏱ <span id="stunt-timer">0.0</span>с</div>
    <div class="stunt-hud-item">📐 <span id="stunt-angle">0</span>°</div>
    <div class="stunt-hud-item">💨 <span id="stunt-speed">15</span> км/ч</div>
    <div class="stunt-hud-item">🪙 <span id="stunt-coins-preview">0</span></div>
    <!-- Блок игровых часов (1 реальная сек = 10 игровых минут) -->
    <div class="stunt-hud-item" style="min-width: 30%;">🕒 <span id="stunt-clock">12:00</span></div>
  </div>
  
  <div class="stunt-scene" id="stunt-scene">
    <div class="stunt-city-bg" id="stunt-city-bg"></div>
    <div class="stunt-bike-wrap">
      <div class="stunt-bike" id="stunt-bike">🏍️</div>
      <div class="stunt-spark-anchor" id="stunt-spark-anchor"></div> 
    </div>
    <div class="stunt-road" id="stunt-road"></div>
  </div>
  
  <div class="stunt-controls">
    <div class="stunt-zone brake" id="stunt-brake"><div class="stunt-zone-icon">🛑</div><div class="stunt-zone-label">ТОРМОЗ</div></div>
    <div class="stunt-zone gas" id="stunt-gas"><div class="stunt-zone-icon">⚡</div><div class="stunt-zone-label">ГАЗ</div></div>
  </div>
  
  <div class="stunt-result hidden" id="stunt-result">
    <div class="stunt-result-card">
      <div class="stunt-result-title" id="stunt-result-title">Заезд окончен!</div>
      <div class="stunt-result-stats" id="stunt-result-stats"></div>
      <button id="stunt-claim-btn" class="claim-btn">Забрать награду</button>
    </div>
  </div>
  <button id="stunt-close-btn" class="stunt-close-btn">✕</button>
</div>

<!-- ОКНО ПОВЫШЕНИЯ УРОВНЯ -->
<div id="level-up-modal" class="custom-modal hidden">
  <div class="modal-card">
    <div class="modal-title">🎉 Поздравляем!</div>
    <div class="modal-desc" id="level-up-desc">Вы достигли уровня!</div>
    <button id="level-up-ok-btn" class="claim-btn" style="width: 100%;">Отлично!</button>
  </div>
</div>

<!-- ОКНО ПРОФИЛЯ -->
<div id="profile-modal" class="custom-modal hidden">
  <div class="modal-card" style="border-color: var(--accent-cyan); box-shadow: 0 0 25px rgba(34,211,238,0.4);">
    <button id="profile-close-btn" class="profile-modal-close">✕</button>
    <div class="avatar-placeholder" id="profile-avatar-large" style="width: 80px; height: 80px; margin: 0 auto 15px; font-size: 24px; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(34,211,238,0.5);">VIP</div>
    <div class="modal-title" id="profile-nickname-large" style="color: white; text-shadow: none; margin-bottom: 5px;">RIDERNICK</div>
    <div style="font-size: 14px; color: var(--accent-cyan); font-weight: bold; margin-bottom: 20px;">Уровень <span id="profile-level-large">1</span></div>
    
    <div style="text-align: left; font-size: 12px; margin-bottom: 5px; display: flex; justify-content: space-between; color: var(--text-dim);">
      <span>Опыт (EXP)</span>
      <span id="profile-exp-text" style="color: white; font-weight: bold;">0 / 200</span>
    </div>
    <div class="level-bar" style="width: 100%; height: 12px; border-radius: 6px; margin-bottom: 20px; background: #1a202c; border: 1px solid rgba(34,211,238,0.3);">
      <div class="level-progress" id="profile-progress-bar-large" style="border-radius: 6px; background-color: var(--accent-cyan);"></div>
    </div>
    <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; font-size: 13px; color: var(--text-dim); display: flex; justify-content: space-between;">
      <span>Всего тапов:</span>
      <span id="profile-total-taps" style="color: var(--accent-orange); font-weight: bold;">0</span>
    </div>
  </div>
</div>

<script>
function scooterImageMarkup(cls) {
  return `<img src="дио1.png" class="${cls}" style="width: 100%; height: auto; display: block;" alt="Скутер">`;
}

const BIKE_CATALOG = {
  scooter: { label: 'Скутеры', emoji: '🛵', bikes: [ { id: 'starter', name: 'Honda Dio 27', price: 0, power: 1, top: '60 км/ч', imgType: 'scooter' } ]}
};

const STARTER_BIKE = { id: 'starter', name: 'Honda Dio 27', power: 1, emoji: '🛵', imgType: 'scooter' };

const TUNING_TYPES = [
  { id: 'engine', name: 'Двигатель', icon: '⚙️', baseCost: 400, costMult: 1.6, powerPerLevel: 3, maxLevel: 10 },
  { id: 'exhaust', name: 'Выхлоп', icon: '🔥', baseCost: 300, costMult: 1.55, powerPerLevel: 2, maxLevel: 10 },
  { id: 'suspension', name: 'Подвеска', icon: '🛠️', baseCost: 350, costMult: 1.55, powerPerLevel: 2, maxLevel: 10 },
  { id: 'tires', name: 'Резина', icon: '🛞', baseCost: 250, costMult: 1.5, powerPerLevel: 1, maxLevel: 10 },
];

const MISSIONS = [
  { id: 'taps50', name: 'Сделать 50 тапов', reward: 300, type: 'taps', target: 50 },
  { id: 'tune3', name: 'Прокачать узел до 3 ур.', reward: 700, type: 'tuneLevel', target: 3 },
];

const LEVEL_REQUIREMENTS = {
  2:  { exp: 200,   reward: 1000 },
  3:  { exp: 300,   reward: 1000 },
  4:  { exp: 450,   reward: 1000 },
  5:  { exp: 700,   reward: 3000 },
  6:  { exp: 1000,  reward: 1500 },
  7:  { exp: 1400,  reward: 1500 },
  8:  { exp: 1900,  reward: 1500 },
  9:  { exp: 2500,  reward: 1500 },
  10: { exp: 3300,  reward: 5000 },
  11: { exp: 4300,  reward: 2500 },
  12: { exp: 5500,  reward: 2500 },
  13: { exp: 7000,  reward: 2500 },
  14: { exp: 8800,  reward: 2500 },
  15: { exp: 11000, reward: 7500 }
};

const SAVE_KEY = 'motoTapalkaSave';

function defaultState() {
  return { coins: 500, totalTaps: 0, level: 1, exp: 0, ownedBikeIds: [], activeBikeId: 'starter', tuning: { engine: 0, exhaust: 0, suspension: 0, tires: 0 }, claimedMissions: {} };
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { return defaultState(); }
}

let state = loadState();
function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

function findBikeById(id) { return STARTER_BIKE; }
function activeBike() { return findBikeById(state.activeBikeId); }
function tuningCost(type, level) { return Math.round(type.baseCost * Math.pow(type.costMult, level)); }
function perTapValue() {
  let value = activeBike().power || 1;
  if(state.tuning) TUNING_TYPES.forEach(t => { value += (state.tuning[t.id] || 0) * t.powerPerLevel; });
  return value;
}
function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }

function addExp(amount) { state.exp += amount; checkLevelUp(); saveState(); renderTop(); }

function checkLevelUp() {
  let nextLevel = state.level + 1;
  if (LEVEL_REQUIREMENTS[nextLevel]) {
    if (state.exp >= LEVEL_REQUIREMENTS[nextLevel].exp) {
      let reward = LEVEL_REQUIREMENTS[nextLevel].reward;
      state.level = nextLevel; state.coins += reward;
      showLevelUpModal(state.level, reward);
      checkLevelUp();
    }
  }
}

function showLevelUpModal(lvl, reward) {
  const modal = document.getElementById('level-up-modal');
  document.getElementById('level-up-desc').innerText = `Вы достигли ${lvl} уровня и получаете ${fmt(reward)} монет!`;
  modal.classList.remove('hidden');
}
document.getElementById('level-up-ok-btn').addEventListener('click', () => { document.getElementById('level-up-modal').classList.add('hidden'); });

function renderTop() {
  document.getElementById('coins-display').innerText = '🪙 ' + fmt(state.coins);
  document.getElementById('user-level-label').innerText = 'Lv ' + state.level;
  let progressPercent = 100;
  if (LEVEL_REQUIREMENTS[state.level + 1]) {
    let currentTargetExp = LEVEL_REQUIREMENTS[state.level + 1].exp;
    let prevTargetExp = state.level === 1 ? 0 : LEVEL_REQUIREMENTS[state.level].exp;
    progressPercent = Math.min(100, Math.max(0, ((state.exp - prevTargetExp) / (currentTargetExp - prevTargetExp)) * 100));
  }
  document.getElementById('level-progress-bar').style.width = progressPercent + '%';
}

const profileModal = document.getElementById('profile-modal');
document.getElementById('user-profile-btn').addEventListener('click', () => { renderProfile(); profileModal.classList.remove('hidden'); });
document.getElementById('profile-close-btn').addEventListener('click', () => { profileModal.classList.add('hidden'); });

function renderProfile() {
  document.getElementById('profile-nickname-large').innerText = document.getElementById('user-nickname').innerText;
  document.getElementById('profile-avatar-large').innerHTML = document.getElementById('avatar-placeholder').innerHTML;
  document.getElementById('profile-level-large').innerText = state.level;
  document.getElementById('profile-total-taps').innerText = fmt(state.totalTaps);
  let progressPercent = 100;
  if (LEVEL_REQUIREMENTS[state.level + 1]) {
    let currentTargetExp = LEVEL_REQUIREMENTS[state.level + 1].exp;
    let prevTargetExp = state.level === 1 ? 0 : LEVEL_REQUIREMENTS[state.level].exp;
    progressPercent = Math.min(100, Math.max(0, ((state.exp - prevTargetExp) / (currentTargetExp - prevTargetExp)) * 100));
    document.getElementById('profile-exp-text').innerText = `${fmt(state.exp)} / ${fmt(currentTargetExp)}`;
  } else {
    document.getElementById('profile-exp-text').innerText = `${fmt(state.exp)} (МАКС)`;
  }
  document.getElementById('profile-progress-bar-large').style.width = progressPercent + '%';
}

function renderGarage() {
  const bike = activeBike();
  document.getElementById('active-bike-name').innerText = bike.name;
  document.getElementById('points-display').innerText = fmt(state.coins) + ' pts';
  document.getElementById('per-tap-display').innerText = '+' + perTapValue() + ' за тап';
  const iconEl = document.getElementById('bike-emoji');
  iconEl.classList.add('is-svg'); iconEl.innerHTML = scooterImageMarkup('scooter-icon-garage');

  const list = document.getElementById('tuning-list');
  list.innerHTML = '';
  TUNING_TYPES.forEach(t => {
    const level = state.tuning ? (state.tuning[t.id] || 0) : 0;
    const maxed = level >= t.maxLevel;
    const cost = tuningCost(t, level);
    const row = document.createElement('div');
    row.className = 'tuning-row';
    row.innerHTML = `<div class="tuning-icon">${t.icon}</div><div class="tuning-info"><div class="tuning-name">${t.name}</div><div class="tuning-level">Уровень ${level} / ${t.maxLevel}</div><div class="tuning-bar"><div class="tuning-bar-fill" style="width:${(level / t.maxLevel) * 100}%"></div></div></div><button class="upgrade-btn" ${maxed || state.coins < cost ? 'disabled' : ''} data-tune="${t.id}">${maxed ? 'Макс.' : '🪙 ' + fmt(cost)}</button>`;
    list.appendChild(row);
  });

  list.querySelectorAll('button[data-tune]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-tune'), type = TUNING_TYPES.find(t => t.id === id), level = state.tuning[id] || 0;
      if (level >= type.maxLevel || state.coins < tuningCost(type, level)) return;
      state.coins -= tuningCost(type, level); state.tuning[id] = level + 1;
      saveState(); renderTop(); renderGarage(); renderMissions();
    });
  });
}

function renderShopTabs() { document.getElementById('shop-tabs').innerHTML = `<div class="shop-tab active">Скутеры</div>`; renderBikeList(); }
function renderBikeList() {
  const listEl = document.getElementById('bike-list');
  listEl.innerHTML = '';
  const card = document.createElement('div');
