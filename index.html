<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мототапалка - Главная</title>
    <style>
        :root {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --accent-orange: #f97316;
            --accent-cyan: #22d3ee;
            --ui-bg: rgba(15, 23, 42, 0.8);
            --glow: 0 0 10px var(--accent-cyan);
            --glow-orange: 0 0 10px var(--accent-orange);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* --- ОБЩИЙ КОНТЕЙНЕР С ФОНОМ GARAGE1 --- */
        #app-container {
            height: 100%;
            width: 100%;
            background-image: url('garage1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- 1. ВЕРХНЯЯ ПАНЕЛЬ --- */
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--ui-bg);
            border-bottom: 2px solid var(--accent-cyan);
            box-shadow: var(--glow);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-orange);
            background: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: var(--glow-orange);
        }

        .stats-text {
            font-size: 13px;
            line-height: 1.2;
        }

        .level-bar {
            width: 90px;
            height: 5px;
            background: #4a5568;
            border-radius: 3px;
            margin-top: 4px;
        }

        .level-progress {
            width: 78%;
            height: 100%;
            background-color: var(--accent-orange);
            border-radius: 3px;
        }

        .currency-panel {
            display: flex;
            gap: 8px;
        }

        .currency-item {
            background: rgba(45, 55, 72, 0.9);
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--accent-cyan);
        }

        /* --- 2. ЦЕНТР (ЗОНА ТАПА) --- */
        .tap-zone {
            flex-grow: 1;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Очки по центру */
        #points-display {
            font-size: 52px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px var(--accent-orange);
            z-index: 3;
            pointer-events: none;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Текстовые заглушки для персонажа и байка */
        .placeholders-container {
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        .object-placeholder {
            background: rgba(15, 23, 42, 0.7);
            border: 1px dashed var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--accent-cyan);
        }

        /* Плавающие бонусы при клике */
        .floating-bonus {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-orange);
            z-index: 4;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 5px #000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        /* --- 3. НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ --- */
        .nav-panel {
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            background: var(--ui-bg);
            border-top: 2px solid var(--accent-cyan);
            box-shadow: var(--glow);
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
            color: var(--accent-cyan);
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav-item.active {
            opacity: 1;
        }

        .nav-text-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .nav-item.active .nav-text-label {
            color: var(--accent-orange);
        }

    </style>
</head>
<body>

    <div id="app-container">
        <!-- Верхняя панель -->
        <div class="top-panel">
            <div class="user-info">
                <div class="avatar-placeholder">VIP</div>
                <div class="stats-text">
                    <strong>RIDERNICK</strong><br>
                    Lv 15
                    <div class="level-bar"><div class="level-progress"></div></div>
                </div>
            </div>
            <div class="currency-panel">
                <div class="currency-item">🪙 4,580</div>
                <div class="currency-item">💰 150</div>
            </div>
        </div>

        <!-- Центральная зона тапа -->
        <div id="tap-zone" class="tap-zone">
            <div id="points-display">95 360 pts</div>
            
            <div class="placeholders-container">
                <div class="object-placeholder">🏍️ Мотоциклист</div>
                <div class="object-placeholder">🏍️ Мотоцикл</div>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div class="nav-panel">
            <div class="nav-item active">
                <div style="font-size: 18px;">🔧</div>
                <div class="nav-text-label">Garage</div>
            </div>
            <div class="nav-item">
                <div style="font-size: 18px;">🛒</div>
                <div class="nav-text-label">Shop</div>
            </div>
            <div class="nav-item">
                <div style="font-size: 18px;">🎯</div>
                <div class="nav-text-label">Missions</div>
            </div>
            <div class="nav-item">
                <div style="font-size: 18px;">👥</div>
                <div class="nav-text-label">Clan</div>
            </div>
        </div>
    </div>

    <script>
        const tapZone = document.getElementById('tap-zone');
        const pointsDisplay = document.getElementById('points-display');
        let currentPoints = 95360;

        tapZone.addEventListener('click', (e) => {
            currentPoints += 100;
            pointsDisplay.innerText = currentPoints.toLocaleString('ru-RU') + ' pts';

            // Создаем всплывающий текст +100 XP
            const b = document.createElement('div');
            b.classList.add('floating-bonus');
            b.innerText = '+100 XP';
            
            const rect = tapZone.getBoundingClientRect();
            b.style.left = `${e.clientX - rect.left - 20}px`;
            b.style.top = `${e.clientY - rect.top - 40}px`;
            
            tapZone.appendChild(b);
            setTimeout(() => b.remove(), 800);
        });
    </script>

</body>
</html>
