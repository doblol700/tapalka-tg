<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto Tapalka</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* Верхняя панель баланса */
        .header {
            text-align: center;
            width: 100%;
        }

        .score-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score {
            font-size: 36px;
            font-weight: 800;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .income-info {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Центральная зона с тапом (Стант-заезд) */
        .clicker-area {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,204,0,0.1) 0%, rgba(18,18,18,0) 70%);
        }

        /* Игровое поле станта */
        .stunt-stage {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 16px;
            background: linear-gradient(180deg, #1e1e24 0%, #0d0d10 70%);
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Городской фон */
        .city-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 120px;
            background-image: 
                linear-gradient(90deg, transparent 40px, #16161c 40px, #16161c 48px, transparent 48px),
                linear-gradient(0deg, #222 0%, #15151a 100%);
            background-size: 60px 100px;
            opacity: 0.5;
            z-index: 1;
        }

        /* Дорога */
        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: #1a1a1a;
            border-top: 2px solid #ffcc00;
            z-index: 2;
            display: flex;
            align-items: center;
        }

        .road-marking {
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(90deg, #ffcc00 0px, #ffcc00 20px, transparent 20px, transparent 40px);
            opacity: 0.7;
        }

        /* Мотоцикл / Скутер */
        .vehicle-container {
            position: absolute;
            bottom: 15px;
            z-index: 3;
            transition: transform 0.1s ease-out;
            transform-origin: bottom left;
        }

        .vehicle-svg {
            width: 120px;
            height: 90px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* Искры из-под заднего крыла */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ff5500;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            box-shadow: 0 0 6px #ffcc00;
            animation: fly-spark 0.4s linear forwards;
        }

        @keyframes fly-spark {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dir-x), var(--dir-y)) scale(0.2);
                opacity: 0;
            }
        }

        /* Всплывающие очки */
        .floating-score {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            pointer-events: none;
            animation: float-up 0.6s ease-out forwards;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }

        /* Нижняя навигация */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 16px;
            padding: 10px 0;
            border: 1px solid #2a2a2a;
        }

        .nav-item {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
            flex: 1;
        }

        .nav-item.active {
            color: #ffcc00;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Экраны (Вкладки) */
        .screen {
            display: none;
            flex: 1;
            width: 100%;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 10px;
        }

        .screen.active {
            display: flex;
        }

        /* Стили магазина и гаража */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
        }

        .shop-list, .garage-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .card-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 12px;
            color: #888;
        }

        .btn {
            background-color: #ffcc00;
            color: #121212;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Верхний блок с балансом -->
        <div class="header">
            <div class="score-title">Баланс монеток</div>
            <div class="score" id="score">0</div>
            <div class="income-info" id="incomeInfo">Доход в сек: +0</div>
        </div>

        <!-- ВКЛАДКА 1: КЛИКЕР / СТАНТ -->
        <div id="clickerScreen" class="screen active">
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div class="stunt-stage" id="stuntStage">
                    <div class="city-bg"></div>
                    <div class="road">
                        <div class="road-marking"></div>
                    </div>
                    <!-- Скутер (векторная икона модели) с точкой заднего крыла для искр -->
                    <div class="vehicle-container" id="vehicle">
                        <svg class="vehicle-svg" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                            <!-- Колёса -->
                            <circle cx="50" cy="120" r="22" fill="#222" stroke="#444" stroke-width="6"/>
                            <circle cx="155" cy="120" r="22" fill="#222" stroke="#444" stroke-width="6"/>
                            <!-- Корпус скутера -->
                            <path d="M 40 100 L 70 85 L 110 90 L 140 115 L 160 115 L 130 65 L 90 50 L 55 70 Z" fill="#1b1b1b" stroke="#333" stroke-width="3"/>
                            <!-- Сиденье -->
                            <path d="M 65 55 Q 95 45 125 55 L 115 65 L 75 65 Z" fill="#0d0d0d"/>
                            <!-- Руль и передняя вилка -->
                            <path d="M 135 65 L 150 40 L 160 45" stroke="#777" stroke-width="5" stroke-linecap="round" fill="none"/>
                            <path d="M 140 65 L 155 120" stroke="#555" stroke-width="4" fill="none"/>
                            <!-- Точка заднего крыла (примерные координаты на спрайте для вылета искр) -->
                            <circle id="exhaustPoint" cx="42" cy="98" r="2" fill="transparent"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: МАГАЗИН -->
        <div id="shopScreen" class="screen">
            <h2 class="section-title">Тюнинг и Улучшения</h2>
            <div class="shop-list" id="shopList">
                <!-- Динамически заполняется скриптом -->
            </div>
        </div>

        <!-- ВКЛАДКА 3: ГАРАЖ -->
        <div id="garageScreen" class="screen">
            <h2 class="section-title">Ваш Гараж</h2>
            <div class="garage-list" id="garageList">
                <div class="card">
                    <div class="card-info">
                        <h3>Черный Скутер (Базовый)</h3>
                        <p>Ваш текущий боевой аппарат</p>
                    </div>
                    <button class="btn" disabled>Активен</button>
                </div>
            </div>
        </div>

        <!-- Нижнее меню навигации -->
        <nav class="nav-bar">
            <button class="nav-item active" onclick="switchScreen('clicker', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Заезд
            </button>
            <button class="nav-item" onclick="switchScreen('shop', this)">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                Магазин
            </button>
            <button class="nav-item" onclick="switchScreen('garage', this)">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
                Гараж
            </button>
        </nav>
    </div>

    <script>
        // Игровое состояние
        let game = {
            score: 0,
            perClick: 1,
            perSecond: 0,
            upgrades: [
                { id: 1, name: "Спортивный коммутатор", desc: "+1 монета за тап", cost: 15, level: 0, power: 1, type: 'click' },
                { id: 2, name: "Прямоточный глушитель", desc: "+5 монет в сек", cost: 100, level: 0, power: 5, type: 'passive' },
                { id: 3, name: "Карбюратор Naraku", desc: "+25 монет в сек", cost: 500, level: 0, power: 25, type: 'passive' }
            ]
        };

        // Загрузка сохранений
        if (localStorage.getItem('motoTapalkaGame')) {
            const saved = JSON.parse(localStorage.getItem('motoTapalkaGame'));
            game.score = saved.score || 0;
            game.perClick = saved.perClick || 1;
            game.perSecond = saved.perSecond || 0;
            if (saved.upgrades) game.upgrades = saved.upgrades;
        }

        function saveGame() {
            localStorage.setItem('motoTapalkaGame', JSON.stringify(game));
        }

        // Интерфейс
        const scoreEl = document.getElementById('score');
        const incomeInfoEl = document.getElementById('incomeInfo');
        const stuntStage = document.getElementById('stuntStage');
        const vehicle = document.getElementById('vehicle');
        const shopList = document.getElementById('shopList');

        function updateUI() {
            scoreEl.innerText = Math.floor(game.score);
            incomeInfoEl.innerText = `Доход в сек: +${game.perSecond}`;
            renderShop();
        }

        // Переключение экранов
        function switchScreen(screenName, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            if (screenName === 'clicker') {
                document.getElementById('clickerScreen').classList.add('active');
            } else if (screenName === 'shop') {
                document.getElementById('shopScreen').classList.add('active');
            } else if (screenName === 'garage') {
                document.getElementById('garageScreen').classList.add('active');
            }
            btnElement.classList.add('active');
        }

        // Обработка тапа (Стант на заднем колесе)
        stuntStage.addEventListener('pointerdown', (e) => {
            const rect = stuntStage.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Начисляем очки
            game.score += game.perClick;
            updateUI();

            // Анимация подъема скутера (стант)
            vehicle.style.transform = 'rotate(-28deg) translateY(-8px)';
            setTimeout(() => {
                vehicle.style.transform = 'rotate(0deg) translateY(0)';
            }, 100);

            // Создаем плавающий текст
            createFloatingText(x, y, `+${game.perClick}`);

            // Создаем искры из точки заднего крыла
            createSparks();
        });

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-score';
            el.innerText = text;
            el.style.left = `${x - 15}px`;
            el.style.top = `${y - 20}px`;
            stuntStage.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function createSparks() {
            // Генерируем несколько искр из зоны заднего крыла
            for (let i = 0; i < 4; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                // Позиция задней части скутера на стейдже
                spark.style.left = '75px';
                spark.style.bottom = '35px';

                // Случайное направление разлета искр назад и вверх
                const dirX = -(Math.random() * 40 + 20) + 'px';
                const dirY = (Math.random() * 30 - 15) + 'px';
                spark.style.setProperty('--dir-x', dirX);
                spark.style.setProperty('--dir-y', dirY);

                stuntStage.appendChild(spark);
                setTimeout(() => spark.remove(), 400);
            }
        }

        // Рендер магазина
        function renderShop() {
            shopList.innerHTML = '';
            game.upgrades.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <h3>${item.name} (Ур. ${item.level})</h3>
                        <p>${item.desc}</p>
                        <p style="color: #ffcc00; margin-top: 3px;">Цена: ${item.cost} монет</p>
                    </div>
                    <button class="btn" ${game.score < item.cost ? 'disabled' : ''} onclick="buyUpgrade(${item.id})">Купить</button>
                `;
                shopList.appendChild(card);
            });
        }

        // Покупка улучшений
        function buyUpgrade(id) {
            const item = game.upgrades.find(u => u.id === id);
            if (game.score >= item.cost) {
                game.score -= item.cost;
                item.level++;
                if (item.type === 'click') {
                    game.perClick += item.power;
                } else if (item.type === 'passive') {
                    game.perSecond += item.power;
                }
                item.cost = Math.floor(item.cost * 1.6); // Рост цены
                updateUI();
                saveGame();
            }
        }

        // Пассивный доход каждую секунду
        setInterval(() => {
            if (game.perSecond > 0) {
                game.score += game.perSecond / 10;
                updateUI();
            }
        }, 100);

        // Автосохранение раз в 5 секунд
        setInterval(saveGame, 5000);

        // Инициализация
        updateUI();
    </script>
</body>
</html>
