<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Tapalka</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #1f1f1f);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #score {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--tg-theme-button-color, #3ffa8b);
        }

        .coin-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5af19, #f2994a);
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.1s ease;
            outline: none;
        }

        .coin-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Мой Кликен</h1>
        <div id="score">0</div>
        <button class="coin-btn" id="tapButton"></button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран

        let score = 0;
        const scoreElement = document.getElementById('score');
        const tapButton = document.getElementById('tapButton');

        // Обработка клика / тапа
        tapButton.addEventListener('click', () => {
            score++;
            scoreElement.textContent = score;
            
            // Легкая вибрация при клике (если поддерживается устройством)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
